<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .parent {

      contain: content;  /* 会行程包含块，改变fixed子元素的参照*/
      margin: 100px auto;
      width: 300px;
      height: 300px;
      border: 1px solid orange;
    }

    .son {
      position: fixed;
      top: 0;
      left: 0;
      width: 100px;
      height: 100px;
      border: 1px solid blue;
    }
  </style>
</head>
<body>
  <div class="parent">
    <div class="son"></div>
  </div>
</body>
</html>
